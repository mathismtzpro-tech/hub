<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Couleur de fond : change uniquement la valeur fill ci-dessous -->
  <rect width="512" height="512" rx="112" fill="#5962FE"/>
  <!-- Le H : deux montants + une barre détachée (l'idée du "hub" qui relie deux côtés) -->
  <g fill="#FFFFFF">
    <rect x="140" y="132" width="68" height="248" rx="16"/>
    <rect x="304" y="132" width="68" height="248" rx="16"/>
    <rect x="218" y="230" width="76" height="52" rx="10"/>
  </g>
</svg>
